name: Vibe - governance and docs

on:
  push:
    branches:
      - "vibe/**"
  pull_request:
    branches:
      - "vibe/**"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node version
        run: node --version

      - name: Governance lock, agent definitions, docs suite, tests
        run: node vibe/tools/verify.mjs
